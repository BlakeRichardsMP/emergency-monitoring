name: Provincial Emergency Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Provincial Monitor
        run: python provincial_monitor.py

      - name: Commit provincial state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add provincial_seen_items.json provincial.xml

          git diff --cached --quiet || git commit -m "Update provincial feed state"

          git push
